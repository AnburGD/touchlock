name: Build AppLock APK

on:
  push:
    branches: [ applock ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Zbuduj APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Nazwij plik
        run: cp app/build/outputs/apk/release/app-release.apk BlokadaAplikacji-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BlokadaAplikacji-v${{ github.run_number }}
          path: BlokadaAplikacji-v${{ github.run_number }}.apk

      - name: Opublikuj w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: applock-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Blokada Aplikacji v${{ github.run_number }}
          files: BlokadaAplikacji-v${{ github.run_number }}.apk
          make_latest: false
