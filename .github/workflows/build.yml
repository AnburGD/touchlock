name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rozpakuj projekt i klucz (tylko za pierwszym razem)
        run: |
          changed=""
          if [ -f bundle.txt ]; then
            python3 - <<'PY'
          import os
          cur = None
          buf = []
          def flush():
              if cur:
                  d = os.path.dirname(cur)
                  if d:
                      os.makedirs(d, exist_ok=True)
                  with open(cur, "w", encoding="utf-8") as f:
                      f.write("".join(buf))
          for line in open("bundle.txt", encoding="utf-8"):
              if line.startswith("=====FILE "):
                  flush()
                  cur = line[10:].strip()
                  buf = []
              else:
                  buf.append(line)
          flush()
          PY
            git rm -q bundle.txt
            changed="1"
          fi
          if [ ! -f app/touchlock.keystore ]; then
            keytool -genkeypair -keystore app/touchlock.keystore -alias touchlock -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=TouchLock"
            changed="1"
          fi
          if [ -n "$changed" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Kod zrodlowy i klucz Touch Lock"
            git push
          fi

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Zbuduj APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Nazwij plik
        run: cp app/build/outputs/apk/release/app-release.apk TouchLock-v${{ github.run_number }}.apk

      - name: Zapisz jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: TouchLock-v${{ github.run_number }}
          path: TouchLock-v${{ github.run_number }}.apk

      - name: Opublikuj w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Touch Lock v${{ github.run_number }}
          files: TouchLock-v${{ github.run_number }}.apk
          make_latest: true
